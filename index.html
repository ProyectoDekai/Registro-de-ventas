<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Ventas</title>

<style>
body { font-family: system-ui, sans-serif; background: #f2f2f2; margin: 0; padding: 12px; }

/* Cabecera con Botón Maestro */
.header-container { 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  position: relative; 
  margin-bottom: 20px;
}
h1 { margin: 0; font-size: 1.4rem; }

/* NUEVO: Contenedor para alinear botón de texto bajo el icono */
.header-actions {
  position: absolute;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.btn-bodega-maestro { 
  background: #2196f3; 
  color: white; 
  border: none; 
  border-radius: 50%; 
  width: 42px; 
  height: 42px; 
  font-size: 1.3rem; 
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Estilo para el botón de texto solicitado */
.btn-sync-text {
  background: none;
  border: none;
  color: #2196f3;
  font-size: 0.65rem;
  font-weight: bold;
  cursor: pointer;
  padding: 4px 0;
  text-transform: uppercase;
}

.card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.1); position: relative; }
input, select, button { width: 100%; padding: 10px; margin-top: 6px; font-size: 1rem; box-sizing: border-box; }
button { border: none; border-radius: 8px; background: #222; color: #fff; cursor: pointer; }
button.secondary { background: #555; }
button.danger { background: #e74c3c; margin-top: 8px; font-size: 0.85rem; padding: 8px; }

.venta { border-left: 6px solid; padding-left: 8px; margin-bottom: 8px; }
.pagado { border-color: #2ecc71; }
.pendiente { border-color: #e74c3c; }
.consumo { border-color: #7f8c8d; }
.small { font-size: 0.85rem; color: #555; }
#status { text-align: center; font-size: 0.8rem; margin-bottom: 8px; font-weight: bold; height: 1rem; }

details { background: #e0e0e0; margin-bottom: 15px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
summary { background: #333; color: white; padding: 12px; cursor: pointer; font-weight: bold; list-style: none; display: flex; flex-direction: column; position: relative; }
summary::after { content: "+"; position: absolute; right: 15px; top: 15px; font-size: 1.2rem; }
details[open] summary::after { content: "-"; }
.summary-header { display: flex; justify-content: space-between; align-items: center; padding-right: 20px; }
.summary-sub { font-size: 0.82rem; color: #ccc; margin-top: 4px; font-weight: normal; line-height: 1.2; }
.group-content { padding: 10px; }

.total-label { font-size: 0.9rem; margin-left: 10px; }
.total-pendiente { color: #ff7675; }

#modalBodega {
  display: none;
  position: fixed;
  z-index: 100;
  left: 0; top: 0; width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.6);
}
.modal-content {
  background-color: white;
  margin: 10% auto;
  padding: 20px;
  border-radius: 12px;
  width: 85%;
  max-width: 400px;
}
</style>
</head>
<body>

<div id="modalBodega">
  <div class="modal-content">
    <h3 style="margin-top:0">Gestión de Bodega / Stock</h3>
    <label class="small">Producto:</label>
    <select id="bodegaSelectProducto"></select>
    <label class="small">Cantidad de unidades:</label>
    <input type="number" id="bodegaCantidad" placeholder="Ej: 12">
    <label class="small">Valor Inversión Lote:</label>
    <input type="number" id="bodegaCosto" placeholder="Ej: 10000">
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    <button class="secondary" onclick="agregarProducto()" style="background: #607d8b; margin-bottom: 10px;">+ Crear nuevo producto</button>
    <button onclick="guardarIngresoBodega()" style="background:#2196f3;">Registrar Ingreso Stock</button>
    <button class="secondary" onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<div class="header-container">
  <h1>Registro de Ventas</h1>
  <div class="header-actions">
    <button class="btn-bodega-maestro" onclick="abrirModalBodega()">📦</button>
    <button class="btn-sync-text" onclick="sincronizarDesdeExcel()">Sincronizar</button>
  </div>
</div>

<div id="status"></div>

<div class="card">
  <input list="clientes" id="cliente" placeholder="Nombre del cliente">
  <datalist id="clientes"></datalist>
  <select id="producto" onchange="actualizarPrecio()"></select>
  <input id="precio" type="number" placeholder="Precio" readonly>
  <select id="estado">
    <option value="Pagado">Pagado</option>
    <option value="Pendiente">Pendiente</option>
  </select>
  <label class="small"><input type="checkbox" id="consumo"> Consumo propio</label>
  <button id="btnGuardar" onclick="agregarVenta()">Guardar venta</button>
</div>

<div class="card">
  <input id="filtroNombre" placeholder="Filtrar por nombre" oninput="render()">
  <select id="filtroEstado" onchange="render()">
    <option value="">Todos los estados</option>
    <option value="Pagado">Pagado</option>
    <option value="Pendiente">Pendiente</option>
  </select>
  <button class="secondary" onclick="exportar()">Exp.CSV</button>
</div>

<div id="lista"></div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwZlgOCfqbQk07BNON-AGjyymHvsyC1Ht1OB-dtY0NU6s-B9HDZtEqHLygxx3JFRb-PrA/exec";

let ventas = JSON.parse(localStorage.getItem("ventas")) || [];
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];
let productos = JSON.parse(localStorage.getItem("productos")) || [{ nombre: "Score Gorilla", precio: 1500 }];

function guardarTodo() {
  localStorage.setItem("ventas", JSON.stringify(ventas));
  localStorage.setItem("clientes", JSON.stringify(clientes));
  localStorage.setItem("productos", JSON.stringify(productos));
}

// NUEVA FUNCIÓN PARA EL BOTÓN SOLICITADO
async function sincronizarDesdeExcel() {
  const statusDiv = document.getElementById("status");
  statusDiv.textContent = "⌛ Sincronizando...";
  try {
    const res = await fetch(ENDPOINT);
    const datosExcel = await res.json();
    
    // Fusión inteligente: No duplicamos IDs
    const excelMap = new Map(datosExcel.map(v => [v.id, v]));
    const localMap = new Map(ventas.map(v => [v.id, v]));
    const fusion = Array.from(new Map([...localMap, ...excelMap]).values());
    
    ventas = fusion.sort((a,b) => b.fecha.localeCompare(a.fecha));
    
    // Actualizar clientes conocidos
    const nuevosClientes = [...new Set(ventas.map(v => v.cliente))].filter(c => !c.includes("SISTEMA"));
    clientes = nuevosClientes;

    guardarTodo();
    render();
    statusDiv.textContent = "✓ Sincronizado";
    setTimeout(() => statusDiv.textContent = "", 2000);
  } catch (e) {
    statusDiv.textContent = "Error de red";
  }
}

async function syncGoogle(datos) {
  const statusDiv = document.getElementById("status");
  try {
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: JSON.stringify(datos) });
    statusDiv.textContent = "✓ Enviado";
    setTimeout(() => statusDiv.textContent = "", 2000);
  } catch (e) {
    statusDiv.textContent = "Error de conexión";
  }
}

function abrirModalBodega() {
  const sel = document.getElementById("bodegaSelectProducto");
  sel.innerHTML = productos.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join("");
  document.getElementById("modalBodega").style.display = "block";
}

function cerrarModal() { document.getElementById("modalBodega").style.display = "none"; }

function guardarIngresoBodega() {
  const prod = document.getElementById("bodegaSelectProducto").value;
  const unidades = document.getElementById("bodegaCantidad").value;
  const costo = document.getElementById("bodegaCosto").value;
  if (!unidades || !costo) return alert("Completa los datos");

  const compra = {
    id: "COMPRA-" + Date.now(),
    fecha: new Date().toISOString().split('T')[0],
    cliente: "SISTEMA: INGRESO STOCK",
    producto: prod,
    precio: Number(costo),
    estado: "BODEGA",
    consumo: false,
    unidades: Number(unidades)
  };

  syncGoogle(compra);
  cerrarModal();
  alert("Stock enviado");
}

function cargarProductos() {
  const select = document.getElementById("producto");
  select.innerHTML = productos.map((p, i) => `<option value="${i}">${p.nombre} ($${p.precio})</option>`).join("");
  actualizarPrecio();
}

function agregarProducto() {
  const nombre = prompt("Nombre:");
  const p = prompt("Precio:");
  if (!nombre || !p) return;
  productos.push({ nombre, precio: Number(p) });
  guardarTodo();
  cargarProductos();
}

function actualizarPrecio() {
  const isConsumo = document.getElementById("consumo").checked;
  const prodIdx = document.getElementById("producto").value;
  document.getElementById("precio").value = isConsumo ? 0 : (productos[prodIdx]?.precio || 0);
}

function agregarVenta() {
  const nom = document.getElementById("cliente").value.trim();
  if (!nom) return alert("Nombre cliente vacío");
  const venta = {
    id: crypto.randomUUID(),
    fecha: new Date().toISOString().split('T')[0],
    cliente: nom,
    producto: productos[document.getElementById("producto").value].nombre,
    precio: Number(document.getElementById("precio").value),
    estado: document.getElementById("estado").value,
    consumo: document.getElementById("consumo").checked,
    unidades: 1
  };
  ventas.push(venta);
  syncGoogle(venta);
  if (!clientes.includes(nom)) {
    clientes.push(nom);
    actualizarClientes();
  }
  guardarTodo();
  render();
  document.getElementById("cliente").value = "";
}

function marcarPagado(id) {
  const v = ventas.find(x => x.id === id);
  if (v) {
    v.estado = "Pagado";
    syncGoogle(v);
    guardarTodo();
    render();
  }
}

function borrarVenta(id) {
  if (confirm("¿Eliminar?")) {
    const idx = ventas.findIndex(x => x.id === id);
    if (idx !== -1) {
      syncGoogle({...ventas[idx], estado: "ELIMINADO"});
      ventas.splice(idx, 1);
      guardarTodo();
      render();
    }
  }
}

function obtenerLunes(fechaStr) {
  const partes = fechaStr.split('-');
  const d = new Date(partes[0], partes[1] - 1, partes[2]);
  const dia = d.getDay();
  const diff = d.getDate() - dia + (dia == 0 ? -6 : 1);
  const lunes = new Date(d.setDate(diff));
  return lunes.toISOString().split('T')[0];
}

function formatearFecha(fechaStr) {
  const partes = fechaStr.split('-');
  return `${partes[2]}/${partes[1]}`;
}

function render() {
  const fn = document.getElementById("filtroNombre").value.toLowerCase();
  const fe = document.getElementById("filtroEstado").value;
  const lista = document.getElementById("lista");
  const filtradas = ventas.filter(v => (!fn || v.cliente.toLowerCase().includes(fn)) && (!fe || v.estado === fe));
  const grupos = {};
  filtradas.forEach(v => {
    const lunes = obtenerLunes(v.fecha);
    if (!grupos[lunes]) grupos[lunes] = [];
    grupos[lunes].push(v);
  });
  const semanasOrdenadas = Object.keys(grupos).sort().reverse();

  lista.innerHTML = semanasOrdenadas.map((semana, index) => {
    const grupoVentas = grupos[semana];
    const totalPagado = grupoVentas.reduce((sum, v) => v.estado === "Pagado" ? sum + v.precio : sum, 0);
    const totalPendiente = grupoVentas.reduce((sum, v) => v.estado === "Pendiente" ? sum + v.precio : sum, 0);
    const contador = {};
    grupoVentas.forEach(v => { contador[v.producto] = (contador[v.producto] || 0) + 1; });
    const resumenProd = Object.entries(contador).map(([p, c]) => `${c}x ${p}`).join(" · ");
    const tarjetas = grupoVentas.map(v => `
      <div class="card venta ${v.consumo ? "consumo" : v.estado === "Pagado" ? "pagado" : "pendiente"}">
        <strong>${v.cliente}</strong> <span style="float:right">$${v.precio}</span><br>
        <span class="small">${v.producto}</span><br>
        <span class="small">${v.estado} · ${v.fecha}</span><br>
        ${v.estado === "Pendiente" ? `<button onclick="marcarPagado('${v.id}')">Marcar pagado</button>` : ""}
        <button class="danger" onclick="borrarVenta('${v.id}')">Borrar</button>
      </div>
    `).join("");
    const fechaLunes = new Date(semana + "T12:00:00");
    const fechaSabado = new Date(fechaLunes);
    fechaSabado.setDate(fechaLunes.getDate() + 5);
    return `<details ${index === 0 ? "open" : ""}>
      <summary>
        <div class="summary-header">
          <span>Sem. ${formatearFecha(semana)} al ${fechaSabado.getDate()}/${fechaSabado.getMonth()+1}</span>
          <div><span class="total-label">Pagado: $${totalPagado}</span><span class="total-label total-pendiente">Deuda: $${totalPendiente}</span></div>
        </div>
        <div class="summary-sub">${resumenProd}</div>
      </summary>
      <div class="group-content">${tarjetas}</div>
    </details>`;
  }).join("");
}

function actualizarClientes() {
  const dl = document.getElementById("clientes");
  dl.innerHTML = clientes.map(c => `<option value="${c}">`).join("");
}

function exportar() {
  let csv = "ID,Fecha,Cliente,Producto,Precio,Estado,Consumo\n";
  ventas.forEach(v => { csv += `"${v.id}","${v.fecha}","${v.cliente}","${v.producto}",${v.precio},"${v.estado}",${v.consumo}\n`; });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ventas_respaldo.csv`;
  a.click();
}

document.getElementById("consumo").addEventListener("change", actualizarPrecio);
actualizarClientes();
cargarProductos();
render();
</script>
</body>
</html>
